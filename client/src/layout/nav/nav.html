<header class="p-3 w-full fixed top-0 z-50 bg-amber-500">
    <div class="flex items-center justify-between max-w-7xl mx-auto px-6">

        <!-- LOGO -->
        <div class="text-white">
            <a routerLink="/" routerLinkActive="text-black"
                [routerLinkActiveOptions]="{exact:true}"
                class="flex items-center gap-3 max-h-16 border-r-2 border-white pr-6">
                
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                    fill="currentColor" class="size-7">
                    <path
                        d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
                </svg>

                <h3 class="text-2xl font-semibold uppercase">Dating app</h3>
            </a>
        </div>

        <!-- NAV LINKS -->
        <nav class="flex gap-6 uppercase text-lg text-white">
            @if (accountService.currentUser()){
                <a routerLink="/members" routerLinkActive="text-black"
                    [routerLinkActiveOptions]="{exact:true}">Matches</a>

                <a routerLink="/lists" routerLinkActive="text-black">Lists</a>
                <a routerLink="/messages" routerLinkActive="text-black">Messages</a>
                <a *appHasRole="['Admin','Moderator']" routerLink="/admin" routerLinkActive="text-black">Admin</a>
            }
            <a routerLink="/errors" routerLinkActive="text-black">Errors</a>
        </nav>
        @if(busyservice.busyRequestCount() > 0){
            <span class="loading loading-spinner text-accent"></span>
        }
        <!-- RIGHT SIDE -->
        <div class="flex items-center gap-4">

            <!-- THEME DROPDOWN -->
            <div class="dropdown dropdown-end">
                <button tabindex="0"
                    class="flex flex-col items-center text-white cursor-pointer uppercase text-xs">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648" />
                    </svg>

                    <span>{{selectedTheme()}}</span>
                </button>

                <ul tabindex="0"
                    class="dropdown-content z-50 menu bg-base-100 rounded-box w-52 p-2 shadow">
                    
                    @for (theme of themes; track $index) {
                        <li (click)="handleSelectTheme(theme)">
                            <a>{{theme}}</a>
                        </li>
                    }
                </ul>
            </div>

            <!-- USER -->
            @if(accountService.currentUser(); as user){
                <div class="dropdown dropdown-end">
                    <div tabindex="0"
                        class="flex items-center text-white text-xl gap-3 cursor-pointer">
                        
                        <img [src]="user?.imageUrl || '/user.png'"
                            alt="user avatar"
                            class="w-10 h-10 rounded-full">

                        <span>{{user.displayName}}</span>
                    </div>

                    <ul (click)="handleSelectUserItem()" tabindex="0"
                        class="dropdown-content menu bg-base-100 rounded-box z-10 w-52 p-2 shadow">
                        
                        <li><a routerLink="/members/{{user.id}}">Edit profile</a></li>
                        <li><a (click)="logout()">Logout</a></li>
                    </ul>
                </div>

            } @else {
                <form #loginForm="ngForm"
                    (ngSubmit)="login()"
                    class="flex items-center gap-3">

                    <input [(ngModel)]="creds.email" name="email"
                        type="text" class="input" placeholder="Email">

                    <input [(ngModel)]="creds.password" name="password"
                        type="password" class="input" placeholder="Password">

                    <button type="submit" 
                    class="btn btn-primary">
                    @if(loading()){
                        <span class="mr-2 loading loading-spinner"></span>
                    }
                    Login</button>
                </form>
            }

        </div>
    </div>
</header>
